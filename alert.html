<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>地震预警</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-user-select: none; user-select: none;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    *::-webkit-scrollbar, html::-webkit-scrollbar, body::-webkit-scrollbar {
      width: 0; height: 0; display: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'OPPO Sans', 'Segoe UI', Tahoma, sans-serif;
      color: #fff;
      background: linear-gradient(150deg, #450a0a 0%, #7f1d1d 45%, #1f0607 100%);
    }
    body.normal {
      background: linear-gradient(150deg, #1e293b 0%, #334155 50%, #0f172a 100%);
    }
    .alert-wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 22px 24px 18px;
    }
    .alert-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag;
    }
    .alert-head-left { display: flex; align-items: center; gap: 10px; }
    .alert-badge {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      background: rgba(239, 68, 68, 0.9);
      padding: 4px 12px;
      border-radius: 999px;
    }
    body.normal .alert-badge { background: rgba(59, 130, 246, 0.9); }
    .alert-title { font-size: 15px; opacity: 0.85; }
    .alert-close {
      -webkit-app-region: no-drag;
      width: 32px; height: 32px;
      border: none; border-radius: 50%;
      background: rgba(255,255,255,0.12);
      color: #fff; font-size: 18px; line-height: 1;
      cursor: pointer;
    }
    .alert-close:hover { background: rgba(255,255,255,0.25); }

    .location {
      margin-top: 14px;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      word-break: break-all;
    }
    .magnitude { margin-top: 4px; font-size: 15px; opacity: 0.85; }

    .countdown-box {
      margin-top: 14px;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      padding: 14px 0 12px;
      text-align: center;
    }
    .countdown-label { font-size: 14px; opacity: 0.8; }
    .countdown-num {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .countdown-num.arrived { color: #fca5a5; font-size: 44px; }
    .countdown-unit { font-size: 16px; font-weight: 600; opacity: 0.85; }

    .stats {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat {
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }
    .stat-value { font-size: 30px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .stat-unit { font-size: 12px; font-weight: 400; opacity: 0.75; }
    .stat-label { margin-top: 3px; font-size: 12px; opacity: 0.75; }

    .advice {
      margin-top: 14px;
      background: rgba(0,0,0,0.3);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }
    .advice b { color: #fde68a; }
  </style>
</head>
<body class="critical">
  <div class="alert-wrap">
    <div class="alert-head">
      <div class="alert-head-left">
        <div class="alert-badge" id="alertBadge">地震预警</div>
        <div class="alert-title" id="alertReport">第 1 报</div>
      </div>
      <button class="alert-close" id="closeBtn" title="关闭">×</button>
    </div>

    <div class="location" id="alertLocation">计算中...</div>
    <div class="magnitude" id="alertMagnitude">震级 --</div>

    <div class="countdown-box">
      <div class="countdown-label">横波到达倒计时</div>
      <div><span class="countdown-num" id="countdownNum">--</span> <span class="countdown-unit" id="countdownUnit">秒</span></div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-value"><span id="localIntensity">--</span><span class="stat-unit"> 度</span></div>
        <div class="stat-label">预估本地烈度</div>
      </div>
      <div class="stat">
        <div class="stat-value"><span id="distance">--</span><span class="stat-unit"> km</span></div>
        <div class="stat-label">震中距</div>
      </div>
    </div>

    <div class="advice" id="advice">正在计算避险建议...</div>
  </div>

  <script src="alert.js"></script>
</body>
</html>
